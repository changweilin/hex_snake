<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hex Snake Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111720;
      --ink: #f3f5f7;
      --muted: #a8b3c2;
      --accent: #f59e0b;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(520px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 22px;
      background: #202633;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 1.35rem;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>目前離線</h1>
    <p>如果你已經開過遊戲，請回到首頁重新載入快取版本。第一次開啟仍需要網路連線完成核心檔案快取。</p>
  </main>
</body>
</html>
