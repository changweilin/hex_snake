<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <link rel="icon" href="data:,">
  <title>六角貪食蛇對戰</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111720;
      --panel: #202633;
      --panel-2: #273140;
      --ink: #f3f5f7;
      --muted: #a8b3c2;
      --line: #374253;
      --accent: #f59e0b;
      --accent-2: #8b5cf6;
      --danger: #f06464;
      --cell: #2a3445;
      --cell-alt: #303c4d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(245, 158, 11, 0.14), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.14), transparent 30rem),
        linear-gradient(135deg, #151922 0%, #1c2230 48%, #18212a 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 312px;
      gap: 18px;
      align-items: stretch;
    }

    .stage {
      min-height: min(78vh, 760px);
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr);
      gap: 12px;
    }

    .topbar,
    .side {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(32, 38, 51, 0.86);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .topbar {
      min-height: 74px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2.1rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: end;
    }

    .metric {
      min-width: 88px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .metric strong {
      font-size: 1.22rem;
      line-height: 1.2;
    }

    .canvas-wrap {
      position: relative;
      min-height: 360px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: #111720;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 20px 80px rgba(0, 0, 0, 0.38);
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 24;
      display: grid;
      place-items: center;
      padding: 12px;
      background: rgba(13, 17, 23, 0.54);
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 160ms ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay.intro-details {
      position: fixed;
      z-index: 80;
      padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    .dialog {
      width: min(420px, 100%);
      max-height: 100%;
      overflow: hidden;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(32, 38, 51, 0.94);
      text-align: center;
      box-shadow: 0 18px 80px rgba(0, 0, 0, 0.45);
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .dialog p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .overlay.intro-details .dialog {
      width: min(760px, 100%);
      height: min(100%, 720px);
      max-height: 100%;
      display: grid;
      grid-template-rows: auto auto;
      align-content: center;
      gap: 10px;
    }

    .intro-close-button {
      justify-self: center;
      min-width: 120px;
    }

    .portrait-lightbox {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      gap: 12px;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: rgba(7, 10, 16, 0.92);
      place-items: center;
    }

    .portrait-lightbox[hidden] {
      display: none;
    }

    .portrait-lightbox-figure {
      min-width: 0;
      min-height: 0;
      width: min(92vw, 680px);
      height: 100%;
      display: grid;
      place-items: center;
      margin: 0;
    }

    .portrait-lightbox-image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 24px 54px rgba(0, 0, 0, 0.58));
    }

    .portrait-lightbox-caption {
      margin-top: 8px;
      color: var(--ink);
      font-weight: 900;
      text-align: center;
    }

    .portrait-lightbox-close {
      min-width: 120px;
    }

    .portrait-lightbox-arrow {
      position: absolute;
      top: 50%;
      width: 48px;
      height: 56px;
      min-height: 56px;
      padding: 0;
      transform: translateY(-50%);
      font-size: 2.2rem;
      line-height: 1;
      z-index: 1;
    }

    .portrait-lightbox-arrow[data-portrait-lightbox-shift="-1"] {
      left: max(14px, env(safe-area-inset-left));
    }

    .portrait-lightbox-arrow[data-portrait-lightbox-shift="1"] {
      right: max(14px, env(safe-area-inset-right));
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #171006;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      padding: 10px 16px;
      min-height: 42px;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button.secondary {
      width: 100%;
      background: #151b25;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    button.secondary.portrait-lightbox-arrow {
      width: 48px;
    }

    .side {
      min-height: 100%;
      border-radius: 8px;
      padding: 14px;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .section {
      padding: 12px;
      border-radius: 8px;
      background: rgba(39, 49, 64, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .settings-section {
      position: relative;
      display: grid;
      justify-items: end;
      gap: 10px;
      z-index: 220;
    }

    .settings-section.open {
      z-index: 260;
    }

    .settings-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .settings-toggle {
      width: 44px;
      min-height: 44px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      background: #151b25;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .gm-toggle {
      width: auto;
      min-width: 54px;
      min-height: 44px;
      padding: 0 12px;
      display: inline-grid;
      place-items: center;
      background: #151b25;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .gm-toggle.is-active {
      border-color: rgba(245, 158, 11, 0.72);
      color: #fde68a;
    }

    .rules-toggle {
      width: auto;
      min-width: 72px;
      min-height: 44px;
      padding: 0 12px;
      background: #151b25;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .settings-toggle:hover,
    .settings-toggle:focus-visible,
    .gm-toggle:hover,
    .gm-toggle:focus-visible,
    .rules-toggle:hover,
    .rules-toggle:focus-visible {
      border-color: var(--accent);
      outline: 2px solid rgba(245, 158, 11, 0.2);
      outline-offset: 2px;
    }

    .settings-toggle svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
    }

    .settings-title {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .settings-content {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 261;
      width: min(360px, calc(100vw - 36px));
      max-height: min(72dvh, 560px);
      overflow-y: auto;
      display: grid;
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(32, 38, 51, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.44);
    }

    .settings-content[hidden] {
      display: none;
    }

    .gm-settings {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(21, 27, 37, 0.68);
    }

    .gm-settings[hidden] {
      display: none;
    }

    .gm-settings > .food-stock-grid {
      display: contents;
    }

    .gm-settings .field + .field {
      margin-top: 0;
    }

    .gm-settings > button {
      grid-column: 1 / -1;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .field + .field {
      margin-top: 10px;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #151b25;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      padding: 8px 10px;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(245, 158, 11, 0.22);
      outline-offset: 2px;
    }

    .field input:disabled,
    .field select:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .toggle-field {
      grid-template-columns: auto 1fr;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-weight: 800;
    }

    .toggle-field input {
      width: 20px;
      min-height: 20px;
      accent-color: var(--accent);
    }

    .keybind-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .keybind-grid .field {
      gap: 5px;
    }

    .keybind-grid .field + .field {
      margin-top: 0;
    }

    .keybind-grid input {
      text-align: center;
      text-transform: uppercase;
    }

    .resource-board {
      display: grid;
      gap: 12px;
    }

    .character-picks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .character-picks[hidden] {
      display: none;
    }

    .character-stage {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 4;
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      pointer-events: none;
    }

    .fighter-card {
      min-width: 0;
      display: grid;
      grid-template-columns: 64px;
      gap: 0;
      align-items: center;
      width: auto;
      padding: 8px;
      border-radius: 8px;
      background: rgba(15, 23, 36, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .fighter-card[data-owner="player"] {
      border-color: rgba(245, 158, 11, 0.38);
    }

    .fighter-card[data-owner="computer"] {
      border-color: rgba(167, 139, 250, 0.34);
    }

    .fighter-card[data-owner="player"],
    .fighter-card[data-owner="computer"],
    .intro-avatar-button[data-owner],
    .portrait-option[data-owner],
    .fighter-portrait[data-owner] {
      --owner-color: #f59e0b;
      --owner-line: #ffedd5;
    }

    [data-owner="computer"] {
      --owner-color: #a78bfa;
      --owner-line: #ede9fe;
    }

    .fighter-module {
      position: relative;
      width: 64px;
      aspect-ratio: 1;
      border-radius: 50%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .fighter-module-clip {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      display: grid;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--fighter-color), white 26%);
      background:
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.24), transparent 28px),
        color-mix(in srgb, var(--fighter-color), #101720 70%);
      box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.28);
      overflow: hidden;
    }

    .fighter-module-clip .fighter-avatar-image.portrait {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: 50% 20%;
      transform: none;
      animation: module-swim 1500ms ease-in-out infinite;
    }

    .fighter-module::before,
    .fighter-portrait::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: inherit;
      border: 2px solid var(--owner-color);
      opacity: 0.82;
      pointer-events: none;
      z-index: 2;
    }

    .fighter-module::before {
      z-index: 3;
    }

    .fighter-module::after,
    .fighter-portrait::after {
      content: attr(data-owner-mark);
      position: absolute;
      right: 5px;
      bottom: 5px;
      min-width: 24px;
      height: 20px;
      padding: 0 5px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 1px solid var(--owner-line);
      background: color-mix(in srgb, var(--owner-color), #101720 34%);
      color: #ffffff;
      font-size: 0.68rem;
      font-weight: 950;
      line-height: 1;
      letter-spacing: 0;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.28);
      pointer-events: none;
      z-index: 3;
    }

    .fighter-card[data-owner="computer"] .fighter-module::before,
    .fighter-portrait[data-owner="computer"]::before {
      border-style: dashed;
    }

    .fighter-module::after {
      top: -7px;
      right: -7px;
      bottom: auto;
      min-width: 22px;
      height: 18px;
      font-size: 0.62rem;
      z-index: 5;
    }

    .fighter-module.is-actionable {
      cursor: pointer;
    }

    .fighter-module.is-charging::before {
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.76);
      animation: charge-ring 560ms linear infinite;
    }

    .fighter-avatar {
      width: 92%;
      height: 92%;
      overflow: visible;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.38));
      animation: module-swim 1500ms ease-in-out infinite;
    }

    .fighter-avatar-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.38));
      animation: module-swim 1500ms ease-in-out infinite;
      pointer-events: none;
    }

    .fighter-avatar-image[data-pose="attack"] {
      opacity: 0.58;
      animation-duration: 520ms;
    }

    .fighter-avatar .body {
      fill: var(--fighter-color);
      stroke: var(--fighter-line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fighter-avatar .accent {
      fill: var(--fighter-accent);
      stroke: var(--fighter-line);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .fighter-avatar .line {
      fill: none;
      stroke: var(--fighter-line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fighter-avatar .eye {
      fill: #111720;
    }

    .fighter-portrait {
      position: relative;
      width: min(220px, 70vw);
      margin: 0 auto 12px;
      aspect-ratio: 1.05;
      display: grid;
      place-items: center;
      border-radius: 8px;
      border: 1px solid color-mix(in srgb, var(--fighter-color), white 28%);
      background:
        radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--fighter-color), transparent 48%), transparent 64%),
        #101720;
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.05), 0 16px 50px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .fighter-portrait[data-owner="computer"] {
      background:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0 7px, transparent 7px 15px),
        radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--fighter-color), transparent 48%), transparent 64%),
        #101720;
    }

    .fighter-portrait .fighter-avatar {
      width: 88%;
      height: 88%;
      animation: portrait-float 1800ms ease-in-out infinite;
    }

    .fighter-portrait .fighter-avatar-image {
      width: 96%;
      height: 96%;
      object-fit: contain;
      animation: portrait-float 1800ms ease-in-out infinite;
    }

    .fighter-portrait.is-defeated {
      opacity: 0.38;
      filter: grayscale(0.78) brightness(0.62) saturate(0.72);
    }

    .result-portrait {
      overflow: hidden;
    }

    .result-portrait.is-defeated {
      opacity: 0.72;
      filter: grayscale(0.68) brightness(0.78) saturate(0.78);
    }

    .result-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      z-index: 4;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(15, 23, 36, 0.82);
      border: 1px solid var(--owner-line);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 950;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
    }

    .result-portrait.is-winner .result-badge {
      background: color-mix(in srgb, var(--owner-color), #101720 28%);
    }

    .portrait-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .portrait-pair .fighter-portrait {
      width: 100%;
      margin-bottom: 0;
    }

    .portrait-select {
      display: grid;
      gap: 10px;
      align-content: start;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      overflow: visible;
    }

    .intro-avatar-gate {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      place-items: center;
    }

    .intro-avatar-button {
      width: 100%;
      padding: 0;
      border-radius: 8px;
      display: grid;
      gap: 8px;
      place-items: center;
      background: transparent;
      color: inherit;
    }

    .intro-avatar-button .fighter-portrait {
      width: 100%;
      margin: 0;
      aspect-ratio: 1.05;
      border-radius: 8px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .intro-avatar-button:hover .fighter-portrait,
    .intro-avatar-button:focus-visible .fighter-portrait {
      transform: scale(1.04);
      border-color: var(--fighter-accent);
      box-shadow: inset 0 0 40px rgba(255, 255, 255, 0.08), 0 18px 58px rgba(0, 0, 0, 0.46);
    }

    .intro-avatar-button .fighter-avatar-image {
      width: 96%;
      height: 96%;
      object-fit: contain;
      object-position: 50% 50%;
      transform: none;
    }

    .intro-avatar-label {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 850;
      margin-top: 8px;
    }

    .portrait-select .portrait-pair {
      margin-bottom: 0;
    }

    .portrait-option {
      min-width: 0;
      display: grid;
      gap: 6px;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .portrait-option .fighter-portrait {
      max-width: 100%;
      opacity: 0.66;
      transform: scale(0.96);
      transition: opacity 150ms ease, transform 150ms ease, border-color 150ms ease;
    }

    .portrait-option.is-selected .fighter-portrait {
      opacity: 1;
      transform: scale(1);
      border-color: var(--fighter-accent);
    }

    .portrait-option-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
    }

    .portrait-option.is-selected .portrait-option-label {
      color: var(--ink);
    }

    .overlay.intro-details .fighter-portrait {
      cursor: zoom-in;
    }

    .overlay.intro-details .fighter-portrait .fighter-avatar-image,
    .overlay.intro-details .fighter-portrait .fighter-avatar {
      width: 90%;
      height: 90%;
      animation: none;

      }

        return `<svg ${common}><path class="body" d="M14 64 C24 34 51 72 66 38 C73 22 91 30 84 49 C77 69 50 56 45 78 C42 91 22 86 14 64Z"/><path class="accent" d="M45 26 L54 5 L61 30Z"/><path class="accent" d="M56 29 L74 12 L71 38Z"/><path class="accent" d="M34 32 L30 8 L47 29Z"/><circle class="eye" cx="77" cy="42" r="3"/></svg>`;
      }
      if (character.id === "moray") {
        return `<svg ${common}><path class="body" d="M12 61 C29 24 50 79 72 36 C80 21 94 36 82 52 C65 75 40 54 31 82 C26 93 10 82 12 61Z"/><path class="accent" d="M24 65 C34 58 41 61 49 69 C37 70 29 75 20 83Z"/><path class="line" d="M71 46 L91 49"/><circle class="eye" cx="78" cy="39" r="3"/></svg>`;
      }
      return `<svg ${common}><path class="body" d="M27 52 C27 34 73 34 73 52 C73 78 27 78 27 52Z"/><path class="accent" d="M30 43 L9 27 C3 36 9 49 24 50Z"/><path class="accent" d="M70 43 L91 27 C97 36 91 49 76 50Z"/><path class="line" d="M37 34 L27 13 M50 31 L50 9 M63 34 L73 13"/><circle class="eye" cx="42" cy="49" r="3"/><circle class="eye" cx="58" cy="49" r="3"/></svg>`;
    }

    function portraitUrl(character, pose, size = "full") {
      const slug = portraitSlugs[character.id] || character.id;
      const safePose = portraitPoses.has(pose) ? pose : "idle";
      if (size === "sm" || size === "md") {
        return `assets/portraits/${size}/${slug}_${safePose}.png`;
      }
      return `assets/portraits/${slug}_${safePose}.png`;
    }

    const preloadedPortraits = new Set();

    function portraitSrcset(character, pose, includeFull = false) {
      const sizes = includeFull ? ["sm", "md", "full"] : ["sm", "md"];
      return sizes.map(size => `${portraitUrl(character, pose, size)} ${portraitSizeWidths[size]}w`).join(", ");
    }

    function preloadPortrait(character, pose, size = "sm") {
      const url = portraitUrl(character, pose, size);
      if (preloadedPortraits.has(url)) return;
      preloadedPortraits.add(url);
      const image = new Image();
      image.decoding = "async";
      image.src = url;
    }

    function preloadPortraitsFor(owner) {
      const character = characterFor(owner);
      ["intro", "idle", "attack", "victory", "defeat"].forEach(pose => preloadPortrait(character, pose, "sm"));
      ["intro", "victory", "defeat"].forEach(pose => preloadPortrait(character, pose, "md"));
    }

    function preloadAllPortraits() {
      characters.forEach(character => {
        ["intro", "idle"].forEach(pose => preloadPortrait(character, pose, "sm"));
      });
    }

    function portraitSizesAttribute(variant) {
      if (variant === "full") return "86vw";
      if (variant === "small") return "(max-width: 700px) 46vw, 220px";
      return "(max-width: 700px) 46vw, 360px";
    }

    function fighterArt(character, pose = "idle", portrait = false, variant = "medium") {
      const imageClass = `fighter-avatar-image${portrait ? " portrait" : ""}`;
      const fallbackSvg = fighterSvg(character, portrait).replace("<svg ", "<svg hidden ");
      const loadMode = portrait || pose === "attack" ? "eager" : "lazy";
      const initialSize = variant === "small" ? "sm" : "md";
      return `
        <img
          class="${imageClass}"
          src="${portraitUrl(character, pose, initialSize)}"
          srcset="${portraitSrcset(character, pose)}"
          sizes="${portraitSizesAttribute(variant)}"
          alt="${character.name}"
          decoding="async"
          loading="${loadMode}"
          data-pose="${pose}"
          onerror="this.hidden=true;this.nextElementSibling.hidden=false"
        >
        ${fallbackSvg}
      `;
    }

    function fighterPortraitImage(character, pose = "idle") {
      return `
        <img
          class="fighter-avatar-image portrait"
          src="${portraitUrl(character, pose, "sm")}"
          srcset="${portraitSrcset(character, pose)}"
          sizes="72px"
          alt="${character.name}"
          decoding="async"
          loading="eager"
          data-pose="${pose}"
        >
      `;
    }

    function characterStyle(character, owner = null) {
      const ownerVars = owner
        ? `--owner-color:${ownerMeta(owner).color};--owner-line:${ownerMeta(owner).line};`

      return `${motto}${moves}${story}`;

    function emptyStock() {
      return Object.fromEntries(foodTypes.map(type => [type.id, 0]));
    }

    function startingStock() {
      if (!gmMode) return emptyStock();
      return Object.fromEntries(foodTypes.map(type => [type.id, clampInitialStock(initialStock[type.id])]));
    }

    function foodBonus(stock, typeId, perPoint, maxBonus) {
      return Math.min(maxBonus, stock[typeId] * perPoint);
    }

    function moveMultiplier(stock) {
      return 1 + foodBonus(stock, "fiber", moveBonusPerPoint, maxMoveBonus);
    }

    function damageMultiplier(stock) {
      return 2 + foodBonus(stock, "fat", damageBonusPerPoint, maxDamageBonus);
    }

    function areaMultiplier(stock) {
      return 1 + stock.carb / maxFoodStock;
    }

    function attackSpeedMultiplier(stock) {
      return 1 + foodBonus(stock, "protein", attackSpeedBonusPerPoint, maxAttackSpeedBonus);
    }

    function moveInterval(stock) {
      return baseStepMs / (initialSpeed * moveMultiplier(stock));
    }

    function moveIntervalFor(owner, now) {
      const stock = owner === "player" ? playerStock : computerStock;
      const slowUntil = owner === "player" ? playerSlowUntil : computerSlowUntil;
      return moveInterval(stock) * (now < slowUntil ? 2 : 1);
    }

    function isMovementStunned(owner, now) {
      return now < (owner === "player" ? playerStunUntil : computerStunUntil);
    }

    function attackDelay(stock) {
      return baseAttackDelayMs / attackSpeedMultiplier(stock);
    }

    function attackCooldown(stock) {
      return baseAttackCooldownMs / attackSpeedMultiplier(stock);
    }

    function blastRadius(stock) {
      if (stock.carb >= maxFoodStock * 0.8) return 4;
      if (stock.carb >= maxFoodStock * 0.4) return 3;
      return baseBlastHexRadius;
    }

    function hasAttackFoodCost(stock) {
      return foodTypes.every(type => stock[type.id] > 0);
    }

    function ammoFor(owner) {
      return owner === "player" ? playerAmmo : computerAmmo;
    }

    function canAttack(owner, profile = "big") {
      const stock = owner === "player" ? playerStock : computerStock;
      return (profile === "small" || ammoFor(owner) > 0) && hasAttackFoodCost(stock);
    }

    function consumeAttackCost(owner, stock, profile = "big") {
      foodTypes.forEach(type => {
        stock[type.id] = Math.max(0, stock[type.id] - 1);
      });
      if (profile !== "small") {
        if (owner === "player") playerAmmo = Math.max(0, playerAmmo - 1);
        else computerAmmo = Math.max(0, computerAmmo - 1);
      }
    }

    function addStock(stock, typeId, amount = 1) {
      stock[typeId] = Math.min(maxFoodStock, stock[typeId] + amount);
    }

    function addAmmoCharge(owner) {
      if (owner === "player") {
        playerAmmoCharge += 1;
        if (playerAmmoCharge >= attackNeedTotal) {
          playerAmmo = Math.min(maxAmmo, playerAmmo + 1);
          playerAmmoCharge = 0;
        }
      } else {
        computerAmmoCharge += 1;
        if (computerAmmoCharge >= attackNeedTotal) {
          computerAmmo = Math.min(maxAmmo, computerAmmo + 1);
          computerAmmoCharge = 0;
        }
      }
    }

    function foodTypeIds(food) {
      if (Array.isArray(food.types) && food.types.length) return food.types;
      return food.type ? [food.type] : [];
    }

    function collectFood(owner, food) {
      const stock = owner === "player" ? playerStock : computerStock;
      const types = foodTypeIds(food);
      const stockGain = types.length > 1 ? 1 : 2;
      types.forEach(typeId => addStock(stock, typeId, stockGain));
      addAmmoCharge(owner);
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);

    function normalizeKey(value, fallback) {
      if (value === " " || value === "Space") return " ";
      const trimmed = String(value || "").trim();
      if (!trimmed) return fallback;

    function clampGridSize(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return gridSize;
      return Math.min(maxGridSize, Math.max(minGridSize, parsed));
    }

    function clampFoodCount(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return foodCount;
      return Math.min(maxFoodCount, Math.max(minFoodCount, parsed));
    }

    function clampInitialSpeed(value) {
      const parsed = Number.parseFloat(value);
      if (!Number.isFinite(parsed)) return initialSpeed;
      return Math.min(maxInitialSpeed, Math.max(minInitialSpeed, parsed));
    }

    function clampInitialLength(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return initialLength;
      return Math.min(maxInitialLength, Math.max(minInitialLength, parsed));
    }

    function clampInitialStock(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return 0;
      return Math.min(maxFoodStock, Math.max(0, parsed));
    }

    function buildCells() {
      cells = [];
      for (let q = -radius; q <= radius; q += 1) {
        const r1 = Math.max(-radius, -q - radius);
        const r2 = Math.min(radius, -q + radius);
        for (let r = r1; r <= r2; r += 1) {
          cells.push({ q, r });
        }
      }
    }

    function setGridSize(value) {
      gridSize = clampGridSize(value);
      radius = gridSize - 1;
      gridSizeInput.value = gridSize;
      buildCells();
    }

    function setFoodCount(value) {

      foodCountInput.value = foodCount;
    }

    function setComputerDifficulty(value) {
      computerDifficulty = ["novice", "low", "medium", "high"].includes(value) ? value : "medium";
      computerDifficultyInput.value = computerDifficulty;
    }

    function setInitialSpeed(value) {
      initialSpeed = clampInitialSpeed(value);
      initialSpeedInput.value = initialSpeed;
    }

    function setInitialLength(value) {
      initialLength = clampInitialLength(value);
      initialLengthInput.value = initialLength;
    }

    function setInitialStock(typeId, value) {
      if (!Object.prototype.hasOwnProperty.call(initialStock, typeId)) return;
      initialStock[typeId] = clampInitialStock(value);
      const input = initialStockInputs.find(stockInput => stockInput.dataset.initialStock === typeId);
      if (input) input.value = initialStock[typeId];
    }

    function setGmMode(active) {

    function keyOf(cell) {
      return `${cell.q},${cell.r}`;
    }

    function isInside(cell) {
      const s = -cell.q - cell.r;
      return Math.max(Math.abs(cell.q), Math.abs(cell.r), Math.abs(s)) <= radius;
    }

    function axialToPixel(cell) {
      return {
        x: center.x + cellSize * Math.sqrt(3) * (cell.q + cell.r / 2),
        y: center.y + cellSize * 1.5 * cell.r
      };
    }

    function pixelToAxial(x, y) {
      const px = x - center.x;
      const py = y - center.y;
      const q = (Math.sqrt(3) / 3 * px - 1 / 3 * py) / cellSize;
      const r = (2 / 3 * py) / cellSize;
      return roundAxial(q, r);
    }

    function roundAxial(q, r) {
      let x = q;
      let z = r;
      let y = -x - z;
      let rx = Math.round(x);
      let ry = Math.round(y);
      let rz = Math.round(z);
      const xDiff = Math.abs(rx - x);
      const yDiff = Math.abs(ry - y);
      const zDiff = Math.abs(rz - z);
      if (xDiff > yDiff && xDiff > zDiff) rx = -ry - rz;
      else if (yDiff > zDiff) ry = -rx - rz;
      else rz = -rx - ry;
      return { q: rx, r: rz };
    }

    function nearestInsideCell(cell) {
      if (isInside(cell)) return cell;
      return cells.reduce((bestCell, candidate) => {
        return hexDistance(candidate, cell) < hexDistance(bestCell, cell) ? candidate : bestCell;
      }, cells[0]);
    }

    function hexPath(x, y, size) {
      ctx.beginPath();
      for (let i = 0; i < 6; i += 1) {
        const angle = Math.PI / 180 * (60 * i - 30);
        const px = x + size * Math.cos(angle);
        const py = y + size * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function resize() {
      const rect = playArea.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      center = { x: rect.width / 2, y: rect.height / 2 };
      const boardWidth = Math.sqrt(3) * (radius * 2 + 1);
      const boardHeight = radius * 3 + 2;
      cellSize = Math.min(rect.width / (boardWidth + 0.8), rect.height / (boardHeight + 0.8));
      draw();
    }

    function createStartingSnake(head, direction, length) {
      const segments = [{ ...head }];
      let cursor = { ...head };
      const bodyDirection = (direction + 3) % 6;
      const used = new Set([keyOf(cursor)]);
      while (segments.length < length) {
        const next = nextWrappedCell(cursor, bodyDirection);
        const nextKey = keyOf(next);
        if (used.has(nextKey)) break;
        segments.push(next);
        used.add(nextKey);
        cursor = next;
      }
      return segments;
    }

    function resetGame() {
      renderWinnerPortrait(null);
      Object.values(portraitPoseTimers).forEach(clearTimeout);
      portraitPoseTimers = {};
      preloadPortraitsFor("player");
      preloadPortraitsFor("computer");
      buildCharacterStage();
      const offset = Math.min(2, Math.max(1, radius - 3));
      dir = 0;
      nextDir = 0;
      computerDir = 3;
      const startLength = gmMode ? initialLength : defaultSettings.initialLength;
      snake = createStartingSnake({ q: -offset, r: offset }, dir, startLength);
      computerSnake = createStartingSnake({ q: offset, r: -offset }, computerDir, startLength);
      score = 0;
      computerScore = 0;
      playerHp = snake.length;
      computerHp = computerSnake.length;
      playerStock = startingStock();
      computerStock = startingStock();
      playerAmmo = 0;

      lastPlayerStep = 0;
      lastComputerStep = 0;

      playerSlowUntil = 0;

    }

    function randomFoodType(preferredFoodId = null) {
      if (!preferredFoodId || preferredFoodId === "balanced") {
        return foodTypes[Math.floor(Math.random() * foodTypes.length)];
      }
      let roll = Math.random();
      for (const type of foodTypes) {
        const weight = type.id === preferredFoodId ? 0.4 : 0.2;
        if (roll < weight) return type;
        roll -= weight;
      }
      return foodTypes[foodTypes.length - 1];
    }

    function randomFoodTypeIds(preferredFoodId = null, dualColor = false) {
      const firstType = randomFoodType(preferredFoodId);
      if (!dualColor) return [firstType.id];
      const secondOptions = foodTypes.filter(type => type.id !== firstType.id);
      const secondType = secondOptions[Math.floor(Math.random() * secondOptions.length)];
      return [firstType.id, secondType.id];
    }

    function placeFoods(preferredOwners = []) {
      const occupied = new Set([
        ...snake.map(keyOf),
        ...computerSnake.map(keyOf),
        ...foods.map(keyOf)
      ]);
      let generated = 0;
      while (foods.length < foodCount) {
        const openCells = cells.filter(cell => !occupied.has(keyOf(cell)));
        if (!openCells.length) return;
        const cell = openCells[Math.floor(Math.random() * openCells.length)];
        const owner = preferredOwners[generated];
        const character = owner ? characterFor(owner) : null;
        const preferredFoodId = character ? character.food : null;
        const dualColor = character?.food === "balanced" && Math.random() < 0.5;
        foods.push({ q: cell.q, r: cell.r, types: randomFoodTypeIds(preferredFoodId, dualColor) });
        occupied.add(keyOf(cell));
        generated += 1;
      }
    }

    function updateStockHud(owner, stock, ammo, ammoCharge) {

      }
      foodTypes.forEach(type => {
        const count = stock[type.id];
        const countEl = resourceBoard.querySelector(`[data-count="${owner}-${type.id}"]`);
        const fill = resourceBoard.querySelector(`[data-fill="${owner}-${type.id}"]`);

    function updateHud() {
      scoreEl.textContent = `${score} HP ${Math.max(0, Math.ceil(playerHp))}/${snake.length}`;
      computerScoreEl.textContent = `${computerScore} HP ${Math.max(0, Math.ceil(computerHp))}/${computerSnake.length}`;
      bestEl.textContent = best;
      totalTimeEl.textContent = formatTime(totalElapsedMs);
      lastFeedTimeEl.textContent = formatTime(lastFeedElapsedMs);
      bestTimeEl.textContent = formatTime(bestTotalMs);
      const now = performance.now();
      const playerSpeedValue = isMovementStunned("player", now) ? 0 : initialSpeed * moveMultiplier(playerStock) / (now < playerSlowUntil ? 2 : 1);
      const computerSpeedValue = isMovementStunned("computer", now) ? 0 : initialSpeed * moveMultiplier(computerStock) / (now < computerSlowUntil ? 2 : 1);
      const playerSpeed = Math.round(playerSpeedValue * 10) / 10;
      const computerSpeed = Math.round(computerSpeedValue * 10) / 10;
      speedEl.textContent = `${playerSpeed}x/${computerSpeed}x`;
      keyEls.forEach(el => el.classList.toggle("active", Number(el.dataset.dir) === nextDir));
      updateStockHud("player", playerStock, playerAmmo, playerAmmoCharge);
      updateStockHud("computer", computerStock, computerAmmo, computerAmmoCharge);
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function canTurn(newDir) {
      return snake.length < 2 || (newDir + 3) % 6 !== dir;
    }

    function canComputerTurn(newDir) {
      return computerSnake.length < 2 || (newDir + 3) % 6 !== computerDir;
    }

    function hexDistance(a, b) {
      const as = -a.q - a.r;
      const bs = -b.q - b.r;
      return (Math.abs(a.q - b.q) + Math.abs(a.r - b.r) + Math.abs(as - bs)) / 2;
    }

    function nextCell(head, direction) {
      const delta = directions[direction];
      return { q: head.q + delta.q, r: head.r + delta.r };
    }

    function nextWrappedCell(head, direction) {
      const next = nextCell(head, direction);
      if (isInside(next)) return next;

      const oppositeDirection = (direction + 3) % 6;
      let wrapped = head;
      while (isInside(nextCell(wrapped, oppositeDirection))) {
        wrapped = nextCell(wrapped, oppositeDirection);
      }
      return wrapped;
    }

    function directionalAttackTarget(direction) {
      let target = { ...snake[0] };
      for (let step = 0; step < targetMaxHex; step += 1) {
        const next = nextWrappedCell(target, direction);
        target = next;
      }
      return target;
    }

    function nearestFoodDistance(cell) {
      if (!foods.length) return Number.POSITIVE_INFINITY;
      return Math.min(...foods.map(food => hexDistance(cell, food)));
    }

    function randomItem(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function isNoviceComputer() {
      return computerDifficulty === "novice";
    }

    function computerAvoidsOpponentBody() {
      const ignoreBodyChance = { novice: 0.55, low: 0.35, medium: 0, high: 0 }[computerDifficulty] ?? 0;
      return Math.random() >= ignoreBodyChance;
    }

    function computerCanGrow() {
      return !isNoviceComputer();
    }

    function computerCanUseAttack() {
      return !isNoviceComputer();
    }

    function cellsWithinDistance(origin, minDistance, maxDistance) {
      return cells.filter(cell => {
        const distance = hexDistance(cell, origin);
        return distance >= minDistance && distance <= maxDistance;
      });
    }

    function attackTargetDamage(target, radius, damageScale) {
      return damageSnake(snake, target, radius, damageScale);
    }

    function chooseComputerAttackTarget() {
      const playerHead = snake[0];
      const radius = blastRadius(computerStock);
      const damageScale = damageMultiplier(computerStock);

      if (computerDifficulty === "high") {
        const candidates = cellsWithinDistance(playerHead, 0, Math.max(1, Math.ceil(radius)));
        candidates.sort((a, b) => {
          const damageDiff = attackTargetDamage(b, radius, damageScale) - attackTargetDamage(a, radius, damageScale);
          if (damageDiff) return damageDiff;
          return hexDistance(a, playerHead) - hexDistance(b, playerHead);
        });
        return candidates[0] || { ...playerHead };
      }

      if (computerDifficulty === "medium") {
        const nearPlayer = cellsWithinDistance(playerHead, 0, 1);
        return { ...randomItem(nearPlayer.length ? nearPlayer : [playerHead]) };
      }

      const looseAim = cellsWithinDistance(playerHead, 2, 4);
      return { ...randomItem(looseAim.length ? looseAim : cellsWithinDistance(playerHead, 0, 2)) };
    }

    function shortestFoodDistance(start, occupied) {
      const foodKeys = new Set(foods.map(keyOf));
      const visited = new Set([keyOf(start)]);
      const queue = [{ cell: start, distance: 0 }];

      for (let index = 0; index < queue.length; index += 1) {
        const current = queue[index];
        if (foodKeys.has(keyOf(current.cell))) return current.distance;

        directions.forEach((_, direction) => {
          const next = nextWrappedCell(current.cell, direction);
          const nextKey = keyOf(next);
          if (visited.has(nextKey)) return;
          if (occupied.has(nextKey) && !foodKeys.has(nextKey)) return;
          visited.add(nextKey);
          queue.push({ cell: next, distance: current.distance + 1 });
        });
      }

      return Number.POSITIVE_INFINITY;
    }

    function chooseComputerDirection() {
      const playerHead = snake[0];
      const playerThreat = nextWrappedCell(playerHead, nextDir);
      const occupied = new Set([
        ...computerSnake.slice(0, -1).map(keyOf)
      ]);
      if (computerAvoidsOpponentBody()) {
        snake.forEach(segment => occupied.add(keyOf(segment)));
      }
      const options = [];

      directions.forEach((_, candidate) => {
        if (!canComputerTurn(candidate)) return;
        const next = nextWrappedCell(computerSnake[0], candidate);
        const nextKey = keyOf(next);
        if (occupied.has(nextKey)) return;

        const danger = keyOf(playerThreat) === nextKey ? 20 : 0;
        const wallPressure = cells.filter(cell => hexDistance(cell, next) <= 1 && !occupied.has(keyOf(cell))).length;
        const pathDistance = shortestFoodDistance(next, occupied);
        options.push({
          direction: candidate,
          pathValue: Number.isFinite(pathDistance) ? pathDistance : nearestFoodDistance(next),
          tacticalValue: pathDistance + danger - wallPressure * 0.08,
          fallbackValue: nearestFoodDistance(next) + danger - wallPressure * 0.08
        });
      });

      if (!options.length) return computerDir;

      options.sort((a, b) => {
        if (computerDifficulty === "high") return a.pathValue - b.pathValue;
        const aValue = Number.isFinite(a.tacticalValue) ? a.tacticalValue : a.fallbackValue;
        const bValue = Number.isFinite(b.tacticalValue) ? b.tacticalValue : b.fallbackValue;
        return aValue - bValue;
      });
      const randomChance = { high: 0, medium: 0.3, low: 0.52, novice: 0.52 }[computerDifficulty];

      if (Math.random() < randomChance) return randomItem(options).direction;
      return options[0].direction;
    }

    function setDirection(newDir) {
      if (!Number.isInteger(newDir) || newDir < 0 || newDir > 5) return;
      if (canTurn(newDir)) {
        nextDir = newDir;
        hexDirButtons.forEach(button => button.classList.toggle("active", Number(button.dataset.dir) === newDir));
        updateHud();
      }
    }

    function launchAttack(owner, target, now, profile = "big") {
      const stock = owner === "player" ? playerStock : computerStock;
      const lastAttack = owner === "player" ? lastPlayerAttackMs : lastComputerAttackMs;
      const source = owner === "player" ? snake[0] : computerSnake[0];
      const isSmall = profile === "small";
      if (!canAttack(owner, profile)) return false;
      if (now - lastAttack < attackCooldown(stock) * (isSmall ? 0.58 : 1)) return false;
      const delay = attackDelay(stock) * (isSmall ? 0.62 : 1);
      const radius = Math.max(1, blastRadius(stock) + (isSmall ? -1 : 0));
      const damage = damageMultiplier(stock) * (isSmall ? 0.55 : 1);
      consumeAttackCost(owner, stock, profile);
      if (owner === "player") lastPlayerAttackMs = now;
      else lastComputerAttackMs = now;
      setFighterPose(owner, "attack", Math.max(180, Math.min(delay, 320)));
      projectiles.push({
        owner,
        profile,
        source: { q: source.q, r: source.r },
        target: { q: target.q, r: target.r },
        createdAt: now,
        impactAt: now + delay,
        delay,
        radius,
        damage
      });
      updateHud();
      return true;
    }

    function maybeComputerAttack(now) {
      if (!computerCanUseAttack()) return;
      const cooldown = { novice: 6200, low: 6200, medium: 4700, high: 3400 }[computerDifficulty] / attackSpeedMultiplier(computerStock);
      if (now - lastComputerAttackMs < cooldown || !canAttack("computer")) return;
      const target = chooseComputerAttackTarget();
      if (launchAttack("computer", target, now)) {
        lastComputerAttackMs = now;
        setStatus("電腦發射砲彈，2 秒後落地。");
      }
    }

    function damageSnake(parts, target, radius, damageScale) {
      const falloff = rangeDamageFalloffEnabled ? baseBlastHexRadius / Math.max(baseBlastHexRadius, radius) : 1;
      return parts.reduce((total, segment) => {
        const distance = hexDistance(segment, target);
        if (distance > radius) return total;
        const hitChance = Math.max(0, Math.min(1, 1 - distance / radius));
        return total + damageScale * falloff * hitChance;
      }, 0);
    }

    function applyBlastDamage(owner, damage) {
      if (damage <= 0) return;
      if (owner === "player") {
        playerHp = Math.max(0, playerHp - damage);
      } else {
        computerHp = Math.max(0, computerHp - damage);
      }
    }

    function applyCollisionPenalty(owner, severity = 1, now = performance.now()) {
      const stunUntil = now + collisionStunMs * severity;
      const slowUntil = stunUntil + collisionSlowMs * severity;
      if (owner === "player") {
        playerStunUntil = Math.max(playerStunUntil, stunUntil);
        playerSlowUntil = Math.max(playerSlowUntil, slowUntil);
      } else {
        computerStunUntil = Math.max(computerStunUntil, stunUntil);
        computerSlowUntil = Math.max(computerSlowUntil, slowUntil);
      }
    }

    function collisionSeverity(selfHit, opponentHit) {
      if (selfHit) return 2;
      if (opponentHit) return 1;
      return 0;
    }

    function resolveProjectiles(now) {
      const landed = projectiles.filter(projectile => now >= projectile.impactAt);
      if (!landed.length) return;
      projectiles = projectiles.filter(projectile => now < projectile.impactAt);

      landed.forEach(projectile => {
        const radius = projectile.radius || baseBlastHexRadius;
        blasts.push({ target: projectile.target, owner: projectile.owner, radius, startedAt: now, endAt: now + blastDurationMs });
        applyBlastDamage("player", damageSnake(snake, projectile.target, radius, projectile.damage || 1));
        applyBlastDamage("computer", damageSnake(computerSnake, projectile.target, radius, projectile.damage || 1));
      });
      blasts = blasts.filter(blast => now <= blast.endAt);
      if (playerHp <= 0 || computerHp <= 0) endGame(playerHp <= 0, computerHp <= 0);
    }

    function step() {
      dir = nextDir;
      computerDir = chooseComputerDirection();

      const next = nextWrappedCell(snake[0], dir);
      const computerNext = nextWrappedCell(computerSnake[0], computerDir);
      const nextKey = keyOf(next);
      const computerNextKey = keyOf(computerNext);
      const eatenFood = foods.find(food => next.q === food.q && next.r === food.r);
      const computerEatenFood = foods.find(food => computerNext.q === food.q && computerNext.r === food.r);
      const eating = Boolean(eatenFood);
      const computerEating = Boolean(computerEatenFood);
      const body = eating ? snake : snake.slice(0, -1);
      const computerBody = computerEating ? computerSnake : computerSnake.slice(0, -1);
      const playerSelfHit = body.some(segment => keyOf(segment) === nextKey);
      const computerSelfHit = computerBody.some(segment => keyOf(segment) === computerNextKey);
      let playerOpponentHit = computerBody.some(segment => keyOf(segment) === nextKey);
      let computerOpponentHit = body.some(segment => keyOf(segment) === computerNextKey);
      if (nextKey === computerNextKey) {
        playerOpponentHit = true;
        computerOpponentHit = true;
      }
      if (nextKey === keyOf(computerSnake[0]) && computerNextKey === keyOf(snake[0])) {
        playerOpponentHit = true;
        computerOpponentHit = true;
      }

      const playerCollision = collisionSeverity(playerSelfHit, playerOpponentHit);
      const computerCollision = collisionSeverity(computerSelfHit, computerOpponentHit);
      if (playerCollision) applyCollisionPenalty("player", playerCollision);
      if (computerCollision) applyCollisionPenalty("computer", computerCollision);
      if (playerCollision || computerCollision) {
        setStatus("撞擊造成麻痺與減速，撞到自己懲罰加倍。");
      }

      if (!playerCollision) {
        snake.unshift(next);
      }
      if (!computerCollision) {
        computerSnake.unshift(computerNext);
      }

      if (!playerCollision && eating) {
        score += 1;
        collectFood("player", eatenFood);
        best = Math.max(best, score);
        localStorage.setItem("hexSnakeBest", String(best));
        lastFeedElapsedMs = 0;
        playerHp = Math.min(snake.length, playerHp + 1);
      } else if (!playerCollision) {
        snake.pop();
      }

      if (!computerCollision && computerEating) {
        computerScore += 1;
        if (computerCanGrow()) {
          collectFood("computer", computerEatenFood);
          computerHp = Math.min(computerSnake.length, computerHp + 1);
        } else {
          computerSnake.pop();
        }
      } else if (!computerCollision) {
        computerSnake.pop();
      }

      if (eating || computerEating) {
        const eatenKeys = new Set([
          !playerCollision && eating ? nextKey : null,
          !computerCollision && computerEating ? computerNextKey : null
        ].filter(Boolean));
        foods = foods.filter(food => !eatenKeys.has(keyOf(food)));
        placeFoods([
          !playerCollision && eating ? "player" : null,
          !computerCollision && computerEating ? "computer" : null
        ].filter(Boolean));
      }

      updateHud();
    }

    function stepPlayerOnly() {
      dir = nextDir;
      const next = nextWrappedCell(snake[0], dir);
      const nextKey = keyOf(next);
      const eatenFood = foods.find(food => next.q === food.q && next.r === food.r);
      const eating = Boolean(eatenFood);
      const body = eating ? snake : snake.slice(0, -1);
      const playerSelfHit = body.some(segment => keyOf(segment) === nextKey);
      const playerOpponentHit = computerSnake.some(segment => keyOf(segment) === nextKey);
      const playerCollision = collisionSeverity(playerSelfHit, playerOpponentHit);

      if (playerCollision) {
        applyCollisionPenalty("player", playerCollision);
        setStatus("撞擊造成麻痺與減速，撞到自己懲罰加倍。");
        updateHud();
        return;
      }

      snake.unshift(next);
      if (eating) {
        score += 1;
        collectFood("player", eatenFood);
        best = Math.max(best, score);
        localStorage.setItem("hexSnakeBest", String(best));
        lastFeedElapsedMs = 0;
        playerHp = Math.min(snake.length, playerHp + 1);
        foods = foods.filter(food => keyOf(food) !== nextKey);
        placeFoods(["player"]);
      } else {
        snake.pop();
      }
      updateHud();
    }

    function stepComputerOnly() {
      computerDir = chooseComputerDirection();
      const computerNext = nextWrappedCell(computerSnake[0], computerDir);
      const computerNextKey = keyOf(computerNext);
      const computerEatenFood = foods.find(food => computerNext.q === food.q && computerNext.r === food.r);
      const computerEating = Boolean(computerEatenFood);
      const computerBody = computerEating ? computerSnake : computerSnake.slice(0, -1);
      const computerSelfHit = computerBody.some(segment => keyOf(segment) === computerNextKey);
      const computerOpponentHit = snake.some(segment => keyOf(segment) === computerNextKey);
      const computerCollision = collisionSeverity(computerSelfHit, computerOpponentHit);

      if (computerCollision) {
        applyCollisionPenalty("computer", computerCollision);
        setStatus("對手撞擊後麻痺並減速。");
        updateHud();
        return;
      }

      computerSnake.unshift(computerNext);
      if (computerEating) {
        computerScore += 1;
        if (computerCanGrow()) {
          collectFood("computer", computerEatenFood);
          computerHp = Math.min(computerSnake.length, computerHp + 1);
        } else {
          computerSnake.pop();
        }
        foods = foods.filter(food => keyOf(food) !== computerNextKey);
        placeFoods(["computer"]);
      } else {
        computerSnake.pop();
      }
      updateHud();
    }

    function endGame(playerLost = true, computerLost = false) {
      if (gameOver) return;
      running = false;
      gameOver = true;
      restartUnlockAt = performance.now() + gameOverRestartDelayMs;
      setSettingsLocked(false);
      if (totalElapsedMs > bestTotalMs) {
        bestTotalMs = totalElapsedMs;
        localStorage.setItem("hexSnakeBestTotalMs", String(Math.floor(bestTotalMs)));
      }
      updateHud();
      let title = "玩家獲勝";
      if (playerLost && !computerLost) title = "電腦獲勝";
      if (playerLost && computerLost) {
        if (score > computerScore) title = "玩家獲勝";
        else if (computerScore > score) title = "電腦獲勝";
        else title = "平手";
      }
      setStatus(`對戰結束：${title}`);
      overlayTitle.textContent = title;
      const winnerOwner = (!playerLost && computerLost) || (playerLost && computerLost && score > computerScore)
        ? "player"
        : (playerLost && !computerLost) || (playerLost && computerLost && computerScore > score)
          ? "computer"
          : null;
      renderWinnerPortrait(winnerOwner, playerLost, computerLost);
      overlayText.textContent = `玩家 ${score} 分，電腦 ${computerScore} 分。按開始再來一局。`;
      startButton.textContent = "重新開始";
      overlay.classList.add("show");
    }

    function loop(now) {
      if (!running) {
        draw();
        return;
      }
      if (!paused) {
        const delta = lastTimerFrame ? now - lastTimerFrame : 0;
        totalElapsedMs += delta;
        lastFeedElapsedMs += delta;
        lastTimerFrame = now;
      } else {
        lastTimerFrame = now;
      }
      if (!paused) {
        resolveProjectiles(now);
        maybeComputerAttack(now);
      }
      if (running && !paused) {
        const playerDue = !isMovementStunned("player", now) && now - lastPlayerStep >= moveIntervalFor("player", now);
        const computerDue = !isMovementStunned("computer", now) && now - lastComputerStep >= moveIntervalFor("computer", now);
        if (playerDue && computerDue) {
          step();
          lastPlayerStep = now;
          lastComputerStep = now;
        } else if (playerDue) {
          stepPlayerOnly();
          lastPlayerStep = now;
        } else if (computerDue) {
          stepComputerOnly();
          lastComputerStep = now;
        }
      }
      blasts = blasts.filter(blast => now <= blast.endAt);
      updateHud();
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function draw() {
      const rect = playArea.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#111720";
      ctx.fillRect(0, 0, rect.width, rect.height);

      cells.forEach(cell => {
        const { x, y } = axialToPixel(cell);
        const shade = (cell.q - cell.r + radius) % 2 === 0 ? colors.cell : colors.cellAlt;
        hexPath(x, y, cellSize * 0.94);
        ctx.fillStyle = shade;
        ctx.fill();
        ctx.strokeStyle = colors.cellLine;
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      foods.forEach(food => {
        const type = foodTypeIds(food).map(typeId => foodTypeById.get(typeId)).filter(Boolean);
        const { x, y } = axialToPixel(food);
        drawFoodToken(x, y, type);
      });

      drawProjectiles();
      drawTarget();
      drawBlasts();

      if (computerSnake) {
        const computerCharacter = characterFor("computer");
        drawSnake(computerSnake, {
          head: computerCharacter.color,
          body: computerCharacter.body,
          headLine: computerCharacter.line,
          bodyLine: colors.computerBodyLine,
          ownerColor: colors.computerHead,
          ownerLine: colors.computerHeadLine,
          character: computerCharacter,
          owner: "computer"
        });
      }

      if (snake) {
        const playerCharacter = characterFor("player");
        drawSnake(snake, {
          head: playerCharacter.color,
          body: playerCharacter.body,
          headLine: playerCharacter.line,
          bodyLine: colors.bodyLine,
          ownerColor: colors.head,
          ownerLine: colors.headLine,
          character: playerCharacter,
          owner: "player"
        });
      }
    }

    function drawProjectiles() {
      const now = performance.now();
      projectiles.forEach(projectile => {
        const start = axialToPixel(projectile.source || projectile.target);
        const end = axialToPixel(projectile.target);
        const progress = Math.min(1, Math.max(0, (now - projectile.createdAt) / (projectile.delay || baseAttackDelayMs)));
        const x = start.x + (end.x - start.x) * progress;
        const y = start.y + (end.y - start.y) * progress;
        const arcHeight = Math.sin(progress * Math.PI) * cellSize * 1.5;
        ctx.beginPath();
        ctx.arc(x, y - arcHeight, Math.max(5, cellSize * 0.16), 0, Math.PI * 2);
        ctx.fillStyle = characterFor(projectile.owner).color;
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.72)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(end.x, end.y, cellSize * 0.28, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(255,255,255,0.24)";
        ctx.lineWidth = 2;
        ctx.stroke();
      });
    }

    function drawTarget() {
      if (!targetCell || !snake) return;
      if (!targetActive && !canAttack("player", selectedAttackProfile)) return;
      const { x, y } = axialToPixel(targetCell);
      ctx.beginPath();
      const previewRadius = Math.max(1, blastRadius(playerStock) + (selectedAttackProfile === "small" ? -1 : 0));
      ctx.arc(x, y, cellSize * previewRadius * 1.52, 0, Math.PI * 2);
      ctx.fillStyle = canAttack("player", selectedAttackProfile) ? "rgba(245,158,11,0.1)" : "rgba(168,179,194,0.08)";
      ctx.fill();
      ctx.strokeStyle = canAttack("player", selectedAttackProfile) ? "rgba(253,230,138,0.78)" : "rgba(168,179,194,0.36)";
      ctx.lineWidth = 2;
      ctx.setLineDash([6, 6]);
      ctx.stroke();
      ctx.setLineDash([]);
      hexPath(x, y, cellSize * 0.55);
      ctx.strokeStyle = colors.target;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawBlasts() {
      const now = performance.now();
      blasts.forEach(blast => {
        const { x, y } = axialToPixel(blast.target);
        const progress = Math.min(1, (now - blast.startedAt) / blastDurationMs);
        const alpha = 1 - progress;
        ctx.beginPath();
        ctx.arc(x, y, cellSize * (blast.radius || baseBlastHexRadius) * 1.52 * (0.65 + progress * 0.35), 0, Math.PI * 2);
        const blastCharacter = characterFor(blast.owner);
        ctx.fillStyle = hexToRgba(blastCharacter.color, 0.22 * alpha);
        ctx.fill();
        ctx.strokeStyle = hexToRgba(blastCharacter.line, 0.8 * alpha);
        ctx.lineWidth = 3;
        ctx.stroke();
      });
    }

    function drawFoodToken(x, y, tokenTypes) {
      const types = Array.isArray(tokenTypes) ? tokenTypes : [tokenTypes];
      const type = types[0];
      const secondaryType = types[1];
      if (!type) return;
      const size = cellSize * 0.62;
      ctx.save();
      ctx.shadowColor = "rgba(0,0,0,0.42)";
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = type.color;
      ctx.strokeStyle = "#f8fafc";
      ctx.lineWidth = Math.max(2, cellSize * 0.09);

      if (type.id === "protein") {
        ctx.beginPath();
        ctx.arc(x, y, size * 0.74, 0, Math.PI * 2);
      } else if (type.id === "fat") {
        ctx.beginPath();
        ctx.moveTo(x, y - size * 0.82);
        ctx.lineTo(x + size * 0.82, y);
        ctx.lineTo(x, y + size * 0.82);
        ctx.lineTo(x - size * 0.82, y);
        ctx.closePath();
      } else if (type.id === "fiber") {
        ctx.beginPath();
        for (let i = 0; i < 5; i += 1) {
          const angle = -Math.PI / 2 + i * Math.PI * 2 / 5;
          const px = x + Math.cos(angle) * size * 0.82;
          const py = y + Math.sin(angle) * size * 0.82;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
      } else {
        ctx.beginPath();
        ctx.moveTo(x, y - size * 0.9);
        ctx.lineTo(x + size * 0.82, y + size * 0.58);
        ctx.lineTo(x - size * 0.82, y + size * 0.58);
        ctx.closePath();
      }

      if (secondaryType) {
        ctx.save();
        ctx.clip();
        ctx.fillStyle = type.color;
        ctx.fillRect(x - size, y - size, size, size * 2);
        ctx.fillStyle = secondaryType.color;
        ctx.fillRect(x, y - size, size, size * 2);
        ctx.restore();
      } else {
        ctx.fill();
      }
      ctx.stroke();
      ctx.shadowColor = "transparent";

      ctx.strokeStyle = "#111720";
      ctx.fillStyle = "#111720";
      ctx.lineWidth = Math.max(2, cellSize * 0.08);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      if (type.id === "protein") {
        ctx.beginPath();
        ctx.moveTo(x - size * 0.32, y - size * 0.08);
        ctx.bezierCurveTo(x - size * 0.18, y - size * 0.36, x + size * 0.22, y - size * 0.36, x + size * 0.34, y - size * 0.04);
        ctx.bezierCurveTo(x + size * 0.14, y + size * 0.1, x - size * 0.12, y + size * 0.24, x - size * 0.3, y + size * 0.36);
        ctx.stroke();
      } else if (type.id === "fat") {
        ctx.beginPath();
        ctx.arc(x, y, size * 0.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (type.id === "fiber") {
        ctx.beginPath();
        ctx.moveTo(x, y + size * 0.44);
        ctx.quadraticCurveTo(x - size * 0.18, y - size * 0.06, x + size * 0.34, y - size * 0.42);
        ctx.moveTo(x - size * 0.02, y + size * 0.1);
        ctx.lineTo(x - size * 0.34, y - size * 0.16);
        ctx.moveTo(x + size * 0.08, y - size * 0.1);
        ctx.lineTo(x + size * 0.38, y + size * 0.02);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x - size * 0.3, y - size * 0.08);
        ctx.lineTo(x, y + size * 0.24);
        ctx.lineTo(x + size * 0.3, y - size * 0.08);
        ctx.stroke();
      }
      ctx.restore();
    }

    function hexToRgba(hex, alpha) {
      const value = hex.replace("#", "");
      const bigint = Number.parseInt(value, 16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawSnake(parts, palette) {
      parts.forEach((segment, index) => {
        const { x, y } = axialToPixel(segment);
        hexPath(x, y, cellSize * (index === 0 ? 0.82 : 0.76));
        ctx.fillStyle = index === 0 ? palette.head : palette.body;
        ctx.fill();
        ctx.strokeStyle = index === 0 ? palette.headLine : palette.bodyLine;
        ctx.lineWidth = index === 0 ? 3 : 1.5;
        ctx.stroke();
        drawSnakeOwnerMark(x, y, index, palette);
        drawSnakeSegmentDetail(x, y, index, palette);

      });
    }

    function drawSnakeOwnerMark(x, y, index, palette) {
      ctx.save();
      ctx.strokeStyle = palette.ownerColor || palette.headLine;
      ctx.lineWidth = index === 0 ? Math.max(2, cellSize * 0.1) : Math.max(1.2, cellSize * 0.055);
      ctx.setLineDash(palette.owner === "computer" ? [Math.max(3, cellSize * 0.14), Math.max(2, cellSize * 0.1)] : []);
      hexPath(x, y, cellSize * (index === 0 ? 0.9 : 0.82));
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawSnakeSegmentDetail(x, y, index, palette) {
      const character = palette.character;
      if (!character || index === 0) return;
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = index === 0 ? character.accent : hexToRgba(character.line, 0.88);
      ctx.fillStyle = hexToRgba(character.accent, index === 0 ? 0.95 : 0.72);
      ctx.lineWidth = Math.max(1.4, cellSize * 0.055);

      if (palette.owner === "computer") {
        ctx.beginPath();
        ctx.arc(x, y, cellSize * (index === 0 ? 0.58 : 0.5), Math.PI * 0.18, Math.PI * 0.82);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, cellSize * (index === 0 ? 0.58 : 0.5), Math.PI * 1.18, Math.PI * 1.82);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.moveTo(x - cellSize * 0.42, y);
        ctx.lineTo(x + cellSize * 0.42, y);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x, y, Math.max(2, cellSize * 0.09), 0, Math.PI * 2);
        ctx.fill();
      }

      if (index > 0 && index % 2 === 0) {
        ctx.strokeStyle = hexToRgba("#ffffff", 0.48);
        ctx.lineWidth = Math.max(1, cellSize * 0.035);
        ctx.beginPath();
        ctx.moveTo(x - cellSize * 0.22, y - cellSize * 0.26);
        ctx.lineTo(x + cellSize * 0.22, y + cellSize * 0.26);
        ctx.stroke();
      }
      ctx.restore();
    }

    function pointerToDirection(event, rect) {
      const x = event.clientX - (rect.left + rect.width / 2);
      const y = event.clientY - (rect.top + rect.height / 2);
      const distance = Math.hypot(x, y);
      if (distance < Math.max(4, rect.width * 0.035)) return null;
      const angle = Math.atan2(y, x) * 180 / Math.PI;
      const adjusted = (angle + 510) % 360;
      return Math.floor(adjusted / 60) % 6;
    }

    function moveStick(event) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = event.clientX - cx;
      const dy = event.clientY - cy;
      const distance = Math.min(54, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      stick.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
      const newDir = pointerToDirection(event, rect);
      if (newDir !== null) {
        movePointerMoved = true;
        setDirection(newDir);
      }
    }

    function setMoveStickLocked(locked) {
      moveStickLocked = locked;
      moveStickEngaged = locked;
      joyZone.querySelector(".joystick").classList.toggle("locked", locked);
      if (!locked) {
        movePointerId = null;
        moveStickEngaged = false;
        stick.style.transform = "translate(0, 0)";
      }
    }

    function clearMoveStickHoldTimer() {
      if (!moveStickHoldTimer) return;
      clearTimeout(moveStickHoldTimer);
      moveStickHoldTimer = null;
    }

    function pointerNearMoveCenter(event) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      return Math.hypot(event.clientX - cx, event.clientY - cy) < Math.min(46, rect.width * 0.36);
    }

    function engageMoveStick(event) {
      clearMoveStickHoldTimer();
      if (movePointerId !== event.pointerId || moveStickEngaged) return;
      moveStickEngaged = true;
      joyZone.querySelector(".joystick").classList.add("locked");
      moveStick(event);
    }

    function releaseMoveStick(event) {
      clearMoveStickHoldTimer();
      if (moveStickLocked) return;
      movePointerId = null;
      moveStickEngaged = false;
      joyZone.querySelector(".joystick").classList.remove("locked");
      stick.style.transform = "translate(0, 0)";
    }

    function moveTargetStick(event) {
      if (!running || gameOver) {
        if (!autoStartGame()) return;
      }
      const rect = targetZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = event.clientX - cx;
      const dy = event.clientY - cy;
      const rawDistance = Math.hypot(dx, dy);
      const distance = Math.min(54, rawDistance);
      const angle = Math.atan2(dy, dx);
      targetStick.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
      const playerPixel = axialToPixel(snake[0]);
      const maxPixelRange = targetMaxHex * cellSize;
      const ratio = Math.min(1, rawDistance / Math.max(1, rect.width * 0.44));
      const targetPixel = {
        x: playerPixel.x + Math.cos(angle) * maxPixelRange * ratio,
        y: playerPixel.y + Math.sin(angle) * maxPixelRange * ratio
      };
      targetCell = nearestInsideCell(pixelToAxial(targetPixel.x, targetPixel.y));
      targetActive = true;
      draw();
    }

    function releaseTargetStick() {
      targetPointerId = null;
      targetStick.style.transform = "translate(0, 0)";
      if (targetActive && running && !paused && !gameOver) {
        if (launchAttack("player", targetCell || snake[0], performance.now())) {
          setStatus("玩家發射砲彈，2 秒後落地。");
        } else {
          setStatus("攻擊需要 1 枚砲彈，且紅黃綠藍四種庫存各至少 1。");
        }
      }
      targetActive = false;
    }

    function launchPlayerAttack(target, profile = selectedAttackProfile) {
      if (!running || gameOver) {
        if (!autoStartGame()) return false;
      }
      if (paused) return false;
      if (launchAttack("player", target, performance.now(), profile)) {
        targetCell = { ...target };
        targetActive = true;
        draw();
        setTimeout(() => {
          targetActive = false;
          draw();
        }, 180);
        const moveName = profile === "small" ? characterFor("player").smallMove : characterFor("player").bigMove;
        setStatus(`${moveName} 發動。`);
        return true;
      }
      setStatus(profile === "small" ? "小招需要紅黃綠藍四種庫存各至少 1。" : "大招需要 1 枚砲彈，且四種庫存各至少 1。");
      return false;
    }

    function launchPlayerAttackDirection(direction, profile = selectedAttackProfile) {
      if (!running || gameOver) {
        if (!autoStartGame()) return false;
      }
      return launchPlayerAttack(directionalAttackTarget(direction), profile);
    }

      }
      if (!portraitLightbox.hidden) {
        if (event.key === "Escape" || event.key === "Esc") closePortraitLightbox();
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          shiftPortraitLightbox(-1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          shiftPortraitLightbox(1);
        }
        return;
      }
      if (mobileInputQuery.matches) return;
      if (event.target && ["INPUT", "SELECT", "TEXTAREA"].includes(event.target.tagName)) return;

      const pressedKey = event.key === " " ? " " : event.key.toLowerCase();
      if (pressedKey === keybinds.pause) {
        event.preventDefault();
        togglePause();
        return;
      }
      if (pressedKey === keybinds.surrender) {
        event.preventDefault();
        surrenderGame();
        return;
      }
      if (pressedKey === keybinds.smallAttack || pressedKey === keybinds.bigAttack) {
        event.preventDefault();
        if (!running || gameOver) {
          if (!autoStartGame()) return;
        }
        const profile = pressedKey === keybinds.smallAttack ? "small" : "big";
        selectAttackProfile(profile);
        launchPlayerAttack(targetCell || computerSnake[0] || snake[0], profile);
        return;
      }
      if (keyToDir.has(pressedKey)) {
        event.preventDefault();
        launchPlayerAttackDirection(keyToDir.get(pressedKey));
        return;
      }
      if ((pressedKey === " " && keybinds.pause !== " ") || (pressedKey === "q" && keybinds.smallAttack !== "q" && keybinds.bigAttack !== "q")) {
        event.preventDefault();
        return;
      }

      const key = event.key.toLowerCase();
      if (key === " ") {
        if (!running || gameOver) {
          startGame();
          return;
        }
        paused = !paused;
        setStatus(paused ? "已暫停" : "對戰中：吃四種食物累積砲彈資源。");
        overlayTitle.textContent = "暫停";
        overlayText.textContent = "按繼續回到對戰。";
        startButton.textContent = "繼續";
        setOverlayChromeVisible(true);
        overlay.classList.toggle("show", paused);
        if (!paused) {
          lastPlayerStep = performance.now();
          lastComputerStep = lastPlayerStep;
          lastTimerFrame = lastPlayerStep;
        }
        return;
      }

      if (key === "q") {
        if (!running || gameOver) {
          if (!autoStartGame()) return;
        }
        if (launchAttack("player", targetCell || snake[0], performance.now())) {
          setStatus("玩家發射砲彈，2 秒後落地。");
        } else {
          setStatus("攻擊需要 1 枚砲彈，且紅黃綠藍四種庫存各至少 1。");
        }
        return;
      }

      if (keyToDir.has(key)) {
        event.preventDefault();
        launchPlayerAttackDirection(keyToDir.get(key));
        return;
      }
    });

    window.addEventListener("resize", resize);

    setGridSize(gridSizeInput.value);
    setFoodCount(foodCountInput.value);
    setComputerDifficulty(computerDifficultyInput.value);
    setInitialSpeed(initialSpeedInput.value);
    setGmMode(defaultSettings.gmMode);
    setInitialLength(initialLengthInput.value);
    initialStockInputs.forEach(input => setInitialStock(input.dataset.initialStock, input.value));
    setSettingsLocked(false);
    applyKeybinds();
    setLeftHandMode(localStorage.getItem("hexSnakeLeftHandMode") === "1");
    updateAttackButtons();
    resetGame();
    resize();
    renderIntroPortraits(false);
    preloadPortraitsFor("player");
    preloadPortraitsFor("computer");
    if ("requestIdleCallback" in window) {
      requestIdleCallback(preloadAllPortraits, { timeout: 1500 });
    } else {
      setTimeout(preloadAllPortraits, 250);
    }
  </script>
</body>
</html>
