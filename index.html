<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>六角形貪食蛇</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #151922;
      --panel: #202633;
      --panel-2: #273140;
      --ink: #f3f5f7;
      --muted: #a8b3c2;
      --line: #374253;
      --accent: #7dd56f;
      --accent-2: #f5c542;
      --danger: #f06464;
      --cell: #2a3445;
      --cell-alt: #303c4d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(125, 213, 111, 0.16), transparent 34rem),
        linear-gradient(135deg, #151922 0%, #1c2230 48%, #18212a 100%);
      color: var(--ink);
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
      overflow-x: hidden;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 292px;
      gap: 18px;
      align-items: stretch;
    }

    .stage {
      min-height: min(78vh, 760px);
      display: grid;
      grid-template-rows: auto minmax(360px, 1fr);
      gap: 12px;
    }

    .topbar,
    .side {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(32, 38, 51, 0.86);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(12px);
    }

    .topbar {
      min-height: 74px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px 14px;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2.1rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .status {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .metrics {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: end;
    }

    .metric {
      min-width: 88px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--panel-2);
      border: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .metric strong {
      font-size: 1.28rem;
      line-height: 1.2;
    }

    .canvas-wrap {
      position: relative;
      min-height: 360px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      background: #111720;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 20px 80px rgba(0, 0, 0, 0.38);
      touch-action: none;
    }

    .canvas-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: linear-gradient(to top, rgba(17, 23, 32, 0.62), transparent 38%);
      transition: opacity 160ms ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 360px;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(13, 17, 23, 0.54);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .dialog {
      width: min(430px, 100%);
      padding: 22px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(32, 38, 51, 0.94);
      text-align: center;
      box-shadow: 0 18px 80px rgba(0, 0, 0, 0.45);
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 1.55rem;
    }

    .dialog p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #0f1710;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      padding: 10px 16px;
      min-height: 42px;
    }

    button:hover {
      filter: brightness(1.05);
    }

    button.secondary {
      width: 100%;
      background: #151b25;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .side {
      min-height: 100%;
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 14px;
    }

    .section {
      padding: 12px;
      border-radius: 8px;
      background: rgba(39, 49, 64, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 42px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #151b25;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      padding: 8px 10px;
    }

    .field input:focus {
      border-color: var(--accent);
      outline: 2px solid rgba(125, 213, 111, 0.22);
      outline-offset: 2px;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .key {
      min-height: 52px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #151b25;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 800;
    }

    .key.active {
      border-color: var(--accent);
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(125, 213, 111, 0.55);
    }

    .joystick-zone {
      min-height: 220px;
      display: grid;
      place-items: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .joystick {
      position: relative;
      width: 174px;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        conic-gradient(from 30deg, rgba(125, 213, 111, 0.16), rgba(245, 197, 66, 0.12), rgba(110, 186, 255, 0.13), rgba(125, 213, 111, 0.16)),
        #151b25;
      border: 1px solid var(--line);
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.35);
    }

    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 62px;
      aspect-ratio: 1;
      border-radius: 50%;
      translate: -50% -50%;
      background: var(--accent);
      border: 6px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      transition: transform 80ms ease;
    }

    .mobile-tip {
      display: none;
    }

    .legend {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .legend b {
      color: var(--ink);
    }

    @media (max-width: 860px) {
      html,
      body {
        height: 100%;
      }

      body {
        min-height: 100dvh;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        place-items: stretch;
      }

      .app {
        grid-template-columns: 1fr;
        width: 100%;
        min-height: calc(100dvh - max(8px, env(safe-area-inset-top)) - max(8px, env(safe-area-inset-bottom)));
      }

      .stage {
        min-height: 100%;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .metrics {
        justify-content: start;
      }

      .side {
        min-height: 0;
        padding: 0;
        background: transparent;
        border: 0;
        box-shadow: none;
        backdrop-filter: none;
        display: block;
      }

      .side .section {
        margin-top: 10px;
      }

      .side .section:nth-of-type(2),
      .side .section:nth-of-type(4) {
        display: none;
      }

      .canvas-wrap {
        min-height: clamp(440px, 74dvh, 760px);
      }

      .canvas-wrap::after {
        opacity: 1;
      }

      canvas {
        min-height: clamp(440px, 74dvh, 760px);
      }

      .joystick-zone {
        position: fixed;
        left: 50%;
        bottom: calc(18px + env(safe-area-inset-bottom));
        z-index: 12;
        width: min(46vw, 196px);
        min-height: 0;
        padding: 0;
        margin: 0;
        translate: -50% 0;
        background: transparent;
        border: 0;
        pointer-events: auto;
      }

      .joystick {
        width: min(46vw, 176px);
        min-width: 132px;
        background:
          radial-gradient(circle at center, rgba(125, 213, 111, 0.16) 0 34%, transparent 35%),
          conic-gradient(from 30deg, rgba(125, 213, 111, 0.28), rgba(245, 197, 66, 0.2), rgba(110, 186, 255, 0.24), rgba(125, 213, 111, 0.28));
        border: 2px solid rgba(243, 245, 247, 0.44);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.14),
          inset 0 0 32px rgba(0, 0, 0, 0.14),
          0 10px 34px rgba(0, 0, 0, 0.18);
        opacity: 0.78;
      }

      .stick {
        width: min(18vw, 68px);
        min-width: 48px;
        background: rgba(125, 213, 111, 0.38);
        border: 2px solid rgba(255, 255, 255, 0.58);
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.26);
      }

      .mobile-tip {
        display: block;
        position: fixed;
        left: 50%;
        bottom: calc(min(46vw, 176px) + 26px + env(safe-area-inset-bottom));
        z-index: 11;
        translate: -50% 0;
        color: rgba(243, 245, 247, 0.72);
        font-size: 0.78rem;
        font-weight: 700;
        pointer-events: none;
        white-space: nowrap;
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="六角形版貪食蛇遊戲">
    <section class="stage">
      <header class="topbar">
        <div>
          <h1>六角形貪食蛇</h1>
          <div class="status" id="status">拖曳搖桿或按 A W E F X Z 開始移動</div>
        </div>
        <div class="metrics" aria-label="遊戲分數">
          <div class="metric"><span>分數</span><strong id="score">0</strong></div>
          <div class="metric"><span>最佳</span><strong id="best">0</strong></div>
          <div class="metric"><span>速度</span><strong id="speed">1x</strong></div>
          <div class="metric"><span>總時間</span><strong id="totalTime">0:00</strong></div>
          <div class="metric"><span>上次餵食</span><strong id="lastFeedTime">0:00</strong></div>
          <div class="metric"><span>最佳總時間</span><strong id="bestTime">0:00</strong></div>
        </div>
      </header>

      <div class="canvas-wrap" id="playArea">
        <canvas id="game" aria-label="六角形貪食蛇遊戲畫面"></canvas>
        <div class="overlay show" id="overlay">
          <div class="dialog">
            <h2 id="overlayTitle">準備好了</h2>
            <p id="overlayText">吃下金色食物，別撞到自己或離開六角盤面。</p>
            <button id="startButton" type="button">開始</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="side" aria-label="控制面板">
      <section class="section">
        <h2>棋盤設定</h2>
        <div class="field">
          <label for="gridSize">格子數</label>
          <input id="gridSize" type="number" min="6" max="12" step="1" value="10" inputmode="numeric">
        </div>
        <button id="resetBestTimeButton" class="secondary" type="button">刷新最佳總時間</button>
      </section>

      <section class="section">
        <h2>六方向鍵</h2>
        <div class="keys" id="keys">
          <div class="key" data-dir="5">A</div>
          <div class="key" data-dir="0">W</div>
          <div class="key" data-dir="1">E</div>
          <div class="key" data-dir="4">Z</div>
          <div class="key" data-dir="3">X</div>
          <div class="key" data-dir="2">F</div>
        </div>
      </section>

      <section class="section joystick-zone" id="joyZone" aria-label="虛擬搖桿">
        <div class="mobile-tip">滑動搖桿控制方向</div>
        <div class="joystick">
          <div class="stick" id="stick"></div>
        </div>
      </section>

      <section class="section">
        <h2>操作</h2>
        <ul class="legend">
          <li><b>滑鼠 / 觸控</b>：拖曳圓形搖桿決定下一個方向。</li>
          <li><b>A W E F X Z</b>：對應六個相鄰方向。</li>
          <li><b>空白鍵</b>：暫停或繼續。</li>
        </ul>
      </section>
    </aside>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const playArea = document.querySelector("#playArea");
    const overlay = document.querySelector("#overlay");
    const overlayTitle = document.querySelector("#overlayTitle");
    const overlayText = document.querySelector("#overlayText");
    const startButton = document.querySelector("#startButton");
    const statusEl = document.querySelector("#status");
    const scoreEl = document.querySelector("#score");
    const bestEl = document.querySelector("#best");
    const speedEl = document.querySelector("#speed");
    const totalTimeEl = document.querySelector("#totalTime");
    const lastFeedTimeEl = document.querySelector("#lastFeedTime");
    const bestTimeEl = document.querySelector("#bestTime");
    const stick = document.querySelector("#stick");
    const joyZone = document.querySelector("#joyZone");
    const gridSizeInput = document.querySelector("#gridSize");
    const resetBestTimeButton = document.querySelector("#resetBestTimeButton");
    const keyEls = [...document.querySelectorAll(".key")];
    const mobileInputQuery = window.matchMedia("(hover: none), (pointer: coarse), (max-width: 860px)");

    const minGridSize = 6;
    const maxGridSize = 12;
    let gridSize = 10;
    let radius = gridSize - 1;
    const directions = [
      { q: 0, r: -1, angle: -90, key: "w" },
      { q: 1, r: -1, angle: -30, key: "e" },
      { q: 1, r: 0, angle: 30, key: "f" },
      { q: 0, r: 1, angle: 90, key: "x" },
      { q: -1, r: 1, angle: 150, key: "z" },
      { q: -1, r: 0, angle: -150, key: "a" }
    ];
    const colors = {
      cell: "#2a3445",
      cellAlt: "#303c4d",
      cellLine: "#3a4658",
      food: "#f5c542",
      foodLine: "#fff3a7",
      head: "#9af084",
      body: "#62c95f",
      headLine: "#e9ffd7",
      bodyLine: "#245c34",
      eye: "#10160f"
    };
    const keyToDir = new Map(directions.map((dir, index) => [dir.key, index]));
    let cells = [];

    let cellSize = 28;
    let center = { x: 0, y: 0 };
    let snake;
    let food;
    let dir;
    let nextDir;
    let score;
    let best = Number(localStorage.getItem("hexSnakeBest") || 0);
    let bestTotalMs = Number(localStorage.getItem("hexSnakeBestTotalMs") || 0);
    let totalElapsedMs = 0;
    let lastFeedElapsedMs = 0;
    let running = false;
    let paused = false;
    let gameOver = false;
    let stepMs = 190;
    let lastStep = 0;
    let lastTimerFrame = 0;
    let rafId = 0;
    let pointerId = null;

    bestEl.textContent = best;

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    function clampGridSize(value) {
      const parsed = Number.parseInt(value, 10);
      if (!Number.isFinite(parsed)) return gridSize;
      return Math.min(maxGridSize, Math.max(minGridSize, parsed));
    }

    function buildCells() {
      cells = [];
      for (let q = -radius; q <= radius; q += 1) {
        const r1 = Math.max(-radius, -q - radius);
        const r2 = Math.min(radius, -q + radius);
        for (let r = r1; r <= r2; r += 1) {
          cells.push({ q, r });
        }
      }
    }

    function setGridSize(value) {
      gridSize = clampGridSize(value);
      radius = gridSize - 1;
      gridSizeInput.value = gridSize;
      buildCells();
    }

    function keyOf(cell) {
      return `${cell.q},${cell.r}`;
    }

    function isInside(cell) {
      const s = -cell.q - cell.r;
      return Math.max(Math.abs(cell.q), Math.abs(cell.r), Math.abs(s)) <= radius;
    }

    function axialToPixel(cell) {
      return {
        x: center.x + cellSize * Math.sqrt(3) * (cell.q + cell.r / 2),
        y: center.y + cellSize * 1.5 * cell.r
      };
    }

    function hexPath(x, y, size) {
      ctx.beginPath();
      for (let i = 0; i < 6; i += 1) {
        const angle = Math.PI / 180 * (60 * i - 30);
        const px = x + size * Math.cos(angle);
        const py = y + size * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function resize() {
      const rect = playArea.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      center = { x: rect.width / 2, y: rect.height / 2 };
      const boardWidth = Math.sqrt(3) * (radius * 2 + 1);
      const boardHeight = radius * 3 + 2;
      cellSize = Math.min(rect.width / (boardWidth + 0.8), rect.height / (boardHeight + 0.8));
      draw();
    }

    function resetGame() {
      snake = [
        { q: 0, r: 1 },
        { q: 0, r: 2 },
        { q: 0, r: 3 }
      ];
      dir = 0;
      nextDir = 0;
      score = 0;
      stepMs = 190;
      totalElapsedMs = 0;
      lastFeedElapsedMs = 0;
      lastTimerFrame = 0;
      gameOver = false;
      paused = false;
      placeFood();
      updateHud();
      setStatus("移動中");
    }

    function startGame() {
      resetGame();
      running = true;
      overlay.classList.remove("show");
      lastStep = performance.now();
      lastTimerFrame = lastStep;
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function placeFood() {
      const occupied = new Set(snake.map(keyOf));
      const openCells = cells.filter(cell => !occupied.has(keyOf(cell)));
      food = openCells[Math.floor(Math.random() * openCells.length)];
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
      totalTimeEl.textContent = formatTime(totalElapsedMs);
      lastFeedTimeEl.textContent = formatTime(lastFeedElapsedMs);
      bestTimeEl.textContent = formatTime(bestTotalMs);
      const speed = Math.max(1, Math.round((190 / stepMs) * 10) / 10);
      speedEl.textContent = `${speed}x`;
      keyEls.forEach(el => el.classList.toggle("active", Number(el.dataset.dir) === nextDir));
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function canTurn(newDir) {
      return snake.length < 2 || (newDir + 3) % 6 !== dir;
    }

    function setDirection(newDir) {
      if (!Number.isInteger(newDir) || newDir < 0 || newDir > 5) return;
      if (canTurn(newDir)) {
        nextDir = newDir;
        updateHud();
      }
      if (!running || gameOver) startGame();
    }

    function step() {
      dir = nextDir;
      const head = snake[0];
      const delta = directions[dir];
      const next = { q: head.q + delta.q, r: head.r + delta.r };
      const nextKey = keyOf(next);
      const eating = next.q === food.q && next.r === food.r;
      const body = eating ? snake : snake.slice(0, -1);
      const hitSelf = body.some(segment => keyOf(segment) === nextKey);

      if (!isInside(next) || hitSelf) {
        endGame();
        return;
      }

      snake.unshift(next);

      if (eating) {
        score += 1;
        best = Math.max(best, score);
        localStorage.setItem("hexSnakeBest", String(best));
        lastFeedElapsedMs = 0;
        stepMs = Math.max(78, stepMs - 5);
        placeFood();
      } else {
        snake.pop();
      }

      updateHud();
    }

    function endGame() {
      running = false;
      gameOver = true;
      if (totalElapsedMs > bestTotalMs) {
        bestTotalMs = totalElapsedMs;
        localStorage.setItem("hexSnakeBestTotalMs", String(Math.floor(bestTotalMs)));
      }
      updateHud();
      setStatus("遊戲結束");
      overlayTitle.textContent = "撞到了";
      overlayText.textContent = `這次分數 ${score}，再來一局。`;
      startButton.textContent = "重新開始";
      overlay.classList.add("show");
    }

    function loop(now) {
      if (!running) {
        draw();
        return;
      }
      if (!paused) {
        const delta = lastTimerFrame ? now - lastTimerFrame : 0;
        totalElapsedMs += delta;
        lastFeedElapsedMs += delta;
        lastTimerFrame = now;
      } else {
        lastTimerFrame = now;
      }
      if (!paused && now - lastStep >= stepMs) {
        step();
        lastStep = now;
      }
      updateHud();
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function draw() {
      const rect = playArea.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      ctx.fillStyle = "#111720";
      ctx.fillRect(0, 0, rect.width, rect.height);

      cells.forEach(cell => {
        const { x, y } = axialToPixel(cell);
        const shade = (cell.q - cell.r + radius) % 2 === 0 ? colors.cell : colors.cellAlt;
        hexPath(x, y, cellSize * 0.94);
        ctx.fillStyle = shade;
        ctx.fill();
        ctx.strokeStyle = colors.cellLine;
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      if (food) {
        const { x, y } = axialToPixel(food);
        hexPath(x, y, cellSize * 0.72);
        ctx.fillStyle = colors.food;
        ctx.fill();
        ctx.strokeStyle = colors.foodLine;
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      if (snake) {
        snake.forEach((segment, index) => {
          const { x, y } = axialToPixel(segment);
          hexPath(x, y, cellSize * (index === 0 ? 0.82 : 0.76));
          ctx.fillStyle = index === 0 ? colors.head : colors.body;
          ctx.fill();
          ctx.strokeStyle = index === 0 ? colors.headLine : colors.bodyLine;
          ctx.lineWidth = index === 0 ? 3 : 1.5;
          ctx.stroke();

          if (index === 0) {
            const eyeDistance = cellSize * 0.22;
            ctx.fillStyle = colors.eye;
            ctx.beginPath();
            ctx.arc(x - eyeDistance, y - cellSize * 0.08, Math.max(2.5, cellSize * 0.07), 0, Math.PI * 2);
            ctx.arc(x + eyeDistance, y - cellSize * 0.08, Math.max(2.5, cellSize * 0.07), 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }
    }

    function pointerToDirection(event, rect) {
      const x = event.clientX - (rect.left + rect.width / 2);
      const y = event.clientY - (rect.top + rect.height / 2);
      const distance = Math.hypot(x, y);
      if (distance < 18) return null;
      const angle = Math.atan2(y, x) * 180 / Math.PI;
      const adjusted = (angle + 450 + 30) % 360;
      return Math.floor(adjusted / 60) % 6;
    }

    function moveStick(event) {
      const rect = joyZone.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = event.clientX - cx;
      const dy = event.clientY - cy;
      const distance = Math.min(54, Math.hypot(dx, dy));
      const angle = Math.atan2(dy, dx);
      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;
      stick.style.transform = `translate(${x}px, ${y}px)`;
      const newDir = pointerToDirection(event, rect);
      if (newDir !== null) setDirection(newDir);
    }

    function releaseStick() {
      pointerId = null;
      stick.style.transform = "translate(0, 0)";
    }

    gridSizeInput.addEventListener("change", () => {
      setGridSize(gridSizeInput.value);
      running = false;
      cancelAnimationFrame(rafId);
      resetGame();
      resize();
      overlayTitle.textContent = "棋盤已更新";
      overlayText.textContent = `格子數已設定為 ${gridSize}，按開始重新遊玩。`;
      startButton.textContent = "開始";
      overlay.classList.add("show");
    });

    resetBestTimeButton.addEventListener("click", () => {
      bestTotalMs = 0;
      localStorage.setItem("hexSnakeBestTotalMs", "0");
      updateHud();
    });

    startButton.addEventListener("click", () => {
      if (paused && running && !gameOver) {
        paused = false;
        setStatus("移動中");
        overlay.classList.remove("show");
        lastStep = performance.now();
        lastTimerFrame = lastStep;
        return;
      }
      overlayTitle.textContent = "準備好了";
      overlayText.textContent = "吃下金色食物，別撞到自己或離開六角盤面。";
      startButton.textContent = "開始";
      startGame();
    });

    joyZone.addEventListener("pointerdown", event => {
      pointerId = event.pointerId;
      joyZone.setPointerCapture(pointerId);
      moveStick(event);
    });

    joyZone.addEventListener("pointermove", event => {
      if (event.pointerId === pointerId) moveStick(event);
    });

    joyZone.addEventListener("pointerup", releaseStick);
    joyZone.addEventListener("pointercancel", releaseStick);

    playArea.addEventListener("pointerdown", event => {
      if (event.target.closest(".overlay")) return;
      const newDir = pointerToDirection(event, playArea.getBoundingClientRect());
      if (newDir !== null) setDirection(newDir);
    });

    window.addEventListener("keydown", event => {
      if (mobileInputQuery.matches) return;

      const key = event.key.toLowerCase();
      if (key === " ") {
        if (!running || gameOver) {
          startGame();
          return;
        }
        paused = !paused;
        setStatus(paused ? "已暫停" : "移動中");
        overlayTitle.textContent = "暫停";
        overlayText.textContent = "按空白鍵或開始鍵繼續。";
        startButton.textContent = "繼續";
        overlay.classList.toggle("show", paused);
        if (!paused) {
          lastStep = performance.now();
          lastTimerFrame = lastStep;
        }
        return;
      }

      if (keyToDir.has(key)) {
        if (paused) {
          paused = false;
          overlay.classList.remove("show");
          lastStep = performance.now();
          lastTimerFrame = lastStep;
        }
        setDirection(keyToDir.get(key));
      }
    });

    window.addEventListener("resize", resize);

    setGridSize(gridSizeInput.value);
    resetGame();
    resize();
  </script>
</body>
</html>
