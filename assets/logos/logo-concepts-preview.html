<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Snake Fresh Logo Concepts</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      background: #f6f7fb;
      color: #17202a;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 24px;
      max-width: 900px;
      color: #475569;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      max-width: 1180px;
    }

    figure {
      margin: 0;
      padding: 14px;
      border: 1px solid #d9e2ee;
      border-radius: 8px;
      background:
        linear-gradient(45deg, #eef2f7 25%, transparent 25%),
        linear-gradient(-45deg, #eef2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eef2f7 75%),
        linear-gradient(-45deg, transparent 75%, #eef2f7 75%),
        #ffffff;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }

    img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
    }

    figcaption {
      margin-top: 10px;
      font-size: 13px;
      color: #334155;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Hex Snake Fresh Logo Concepts</h1>
  <p>12 款全新透明背景 SVG 草案。這輪不沿用前面的大眼、吉祥物頭像、S 字主構圖或盾牌外框，改用六段、節甲、角刺、羽鰭、鉗形與棋盤路徑做極簡符號化。</p>
  <main class="grid">
    <figure><img src="logo-01-six-scale-ring.svg" alt="Six Scale Ring"><figcaption>01 Six Scale Ring</figcaption></figure>
    <figure><img src="logo-02-scale-knot.svg" alt="Scale Knot"><figcaption>02 Scale Knot</figcaption></figure>
    <figure><img src="logo-03-horn-spine.svg" alt="Horn Spine"><figcaption>03 Horn Spine</figcaption></figure>
    <figure><img src="logo-04-six-direction-bloom.svg" alt="Six Direction Bloom"><figcaption>04 Six Direction Bloom</figcaption></figure>
    <figure><img src="logo-05-claw-compass.svg" alt="Claw Compass"><figcaption>05 Claw Compass</figcaption></figure>
    <figure><img src="logo-06-burrow-tiles.svg" alt="Burrow Tiles"><figcaption>06 Burrow Tiles</figcaption></figure>
    <figure><img src="logo-07-current-circuit.svg" alt="Current Circuit"><figcaption>07 Current Circuit</figcaption></figure>
    <figure><img src="logo-08-venom-lattice.svg" alt="Venom Lattice"><figcaption>08 Venom Lattice</figcaption></figure>
    <figure><img src="logo-09-six-plate-totem.svg" alt="Six Plate Totem"><figcaption>09 Six Plate Totem</figcaption></figure>
    <figure><img src="logo-10-twin-trait-knot.svg" alt="Twin Trait Knot"><figcaption>10 Twin Trait Knot</figcaption></figure>
    <figure><img src="logo-11-crest-cut.svg" alt="Crest Cut"><figcaption>11 Crest Cut</figcaption></figure>
    <figure><img src="logo-12-hex-path-h.svg" alt="Hex Path H"><figcaption>12 Hex Path H</figcaption></figure>
  </main>
</body>
</html>
