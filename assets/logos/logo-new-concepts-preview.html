<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Snake New Logo Concepts</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Noto Sans TC", Arial, sans-serif;
      background: #f5f7fb;
      color: #17202a;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0;
    }

    p {
      max-width: 940px;
      margin: 0 0 24px;
      color: #475569;
      line-height: 1.65;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(188px, 1fr));
      gap: 18px;
      max-width: 1180px;
    }

    figure {
      margin: 0;
      padding: 14px;
      border: 1px solid #d9e2ee;
      border-radius: 8px;
      background:
        linear-gradient(45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(-45deg, #edf2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #edf2f7 75%),
        linear-gradient(-45deg, transparent 75%, #edf2f7 75%),
        #ffffff;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
      background-size: 24px 24px;
    }

    img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: contain;
    }

    figcaption {
      margin-top: 10px;
      font-size: 13px;
      color: #334155;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Hex Snake New Logo Concepts</h1>
  <p>New transparent SVG marks using two to four colors each. The shared language comes from the six chibi creatures: curled bodies, scale plates, horns, claws, big eye geometry, and elemental accents.</p>
  <main class="grid">
    <figure><img src="logo-new-01-coiled-crest.svg" alt="Coiled Crest"><figcaption>01 Coiled Crest</figcaption></figure>
    <figure><img src="logo-new-02-hex-scale-orbit.svg" alt="Hex Scale Orbit"><figcaption>02 Hex Scale Orbit</figcaption></figure>
    <figure><img src="logo-new-03-horn-current-mark.svg" alt="Horn Current Mark"><figcaption>03 Horn Current Mark</figcaption></figure>
    <figure><img src="logo-new-04-claw-moon-knot.svg" alt="Claw Moon Knot"><figcaption>04 Claw Moon Knot</figcaption></figure>
    <figure><img src="logo-new-05-sandleaf-coil.svg" alt="Sandleaf Coil"><figcaption>05 Sandleaf Coil</figcaption></figure>
    <figure><img src="logo-new-06-spine-shield.svg" alt="Spine Shield"><figcaption>06 Spine Shield</figcaption></figure>
    <figure><img src="logo-new-07-venom-eye-loop.svg" alt="Venom Eye Loop"><figcaption>07 Venom Eye Loop</figcaption></figure>
    <figure><img src="logo-new-08-ghost-flame-tail.svg" alt="Ghost Flame Tail"><figcaption>08 Ghost Flame Tail</figcaption></figure>
    <figure><img src="logo-new-09-six-facet-serpent.svg" alt="Six Facet Serpent"><figcaption>09 Six Facet Serpent</figcaption></figure>
    <figure><img src="logo-new-10-crest-mask.svg" alt="Crest Mask"><figcaption>10 Crest Mask</figcaption></figure>
    <figure><img src="logo-new-11-current-compass.svg" alt="Current Compass"><figcaption>11 Current Compass</figcaption></figure>
    <figure><img src="logo-new-12-hex-snake-seal.svg" alt="Hex Snake Seal"><figcaption>12 Hex Snake Seal</figcaption></figure>
  </main>
</body>
</html>
